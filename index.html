<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GATE Schedule</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css">
  <meta property="og:title" content="FFXIV 7.56 GATE Schedule">
  <meta property="og:description" content="Displays the current and upcoming Golden Saucer GATES for Final Fantasy XIV.">
  <meta property="og:image" content="https://rooroodev.github.io/ffxivgateschedule/images/saucer.webp">
  <meta name="theme-color" content="#96ff96">
  <meta name="keywords" content="FFXIV,Golden,Saucer,GATE,Schedule">
</head>
<body>
  <header class="topbar">
    <h1>FFXIV 7.56 GATE Schedule</h1>
    <details class="filters" id="filters">
      <summary>Options</summary>
      <div class="filter-list" id="filter-list"></div>
    </details>
  </header>

  <main>
    <section class="current" id="current" aria-live="polite"></section>
    <div class="section-label">Upcoming</div>
    <ul class="list" id="list"></ul>
    <p class="empty" id="empty" hidden>No GATE types selected. Open Options to choose some.</p>
    <div id="sentinel" aria-hidden="true"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
